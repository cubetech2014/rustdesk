# CubeRemote Phase 0 PoC — 32비트 Windows (i686) core 빌드 가능 여부 확인
#
# 왜 필요한가:
#   운영 중인 Windows POS 중 32비트가 적지 않은데, Flutter Windows 데스크톱은 x64 전용이라
#   현재 agent 는 32비트에 아예 설치할 수 없다. 대안(B안)은 UI 없는 경량 Rust agent 인데,
#   그 전부가 단 하나의 전제에 걸려 있다:
#
#     "RustDesk 네이티브 스택(scrap DXGI 캡처 + libvpx/aom/libyuv/opus)이
#      i686-pc-windows-msvc 로 컴파일되고 '링크'까지 되는가?"
#
#   여기서 막히면 매장 등록/비밀번호/자동 업데이트를 아무리 잘 만들어도 소용이 없으므로,
#   본 구현에 들어가기 전에 이 질문 하나만 싸게 확인한다.
#
# 수동 실행 전용(workflow_dispatch) — tag 빌드와 릴리스 파이프라인에 전혀 영향을 주지 않는다.
#
# 의도적으로 범위에서 뺀 것:
#   - Flutter        : Windows 데스크톱이 x64 전용. 32비트 불가라는 것이 B안의 출발점이다.
#   - hwcodec/ffmpeg : B안 최소 요구사항이 아니다. ffmpeg 의 x86 빌드는 느리고 실패 위험이
#                      커서, 실패해도 정작 알고 싶은 것(코덱+캡처+링크)을 못 알려준다.
#                      소프트웨어 인코딩으로 POS 화면에 충분한지는 별도 판단 사항.
#
# 1차 시도(--features cli)가 남긴 것 — 같은 함정 다시 밟지 말 것:
#   cli feature 로 sciter ui 를 빼려 했으나 src/cli.rs 가 2024-03-27 이후 방치된 코드라
#   (src/client.rs 는 2026-04-15) Interface trait / initialize() 인자수 / Data::Login 튜플 /
#   Stream 타입 변경을 못 따라가 19개 에러로 죽었다. x86 과 무관한 순수 bit-rot 이다.
#   다만 그 시점까지 온 것만으로 얻은 게 크다:
#     vcpkg x86-windows-static (libvpx/aom/libyuv/opus) 빌드 성공,
#     libs/scrap (DXGI 캡처 + bindgen FFI) i686 컴파일 성공,
#     hbb_common / platform::windows / server / cuberemote_heartbeat 모두 컴파일 성공.
#   그래서 이제 남은 미지수는 '링크' 하나다. sciter 를 포함한 채로라도 링크가 되면
#   headless(B안)는 코드를 빼는 방향이라 당연히 링크된다.
#
# 참고 — 32비트 지원 흔적이 이미 코드에 남아 있다 (과거 sciter x86 빌드 라인):
#   .cargo/config.toml       : [target.i686-pc-windows-msvc] rustflags 존재
#   libs/scrap/build.rs      : target_arch == "x86" → vcpkg triplet 을 x86-windows-static 으로 치환
#   flutter-build.yml        : build-for-windows-sciter 의 i686 항목 (주석 처리됨)
name: PoC - Windows x86 (32bit) core build

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  # flutter-build.yml 과 동일한 vcpkg 고정 커밋 (포트 버전 일치시키기 위함)
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  CARGO_TARGET: i686-pc-windows-msvc
  VCPKG_TRIPLET: x86-windows-static

jobs:
  poc-win32-core:
    name: i686 core build
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (i686 target)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: i686-pc-windows-msvc
          components: "rustfmt"

      # bindgen (scrap 의 vpx/aom/yuv FFI 생성) 이 libclang 을 요구한다
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: poc-win32
          key: ${{ env.CARGO_TARGET }}
          # 실패해도 캐시를 저장한다. PoC 는 링크 단계까지 가야 답이 나오는데
          # 기본값(false)이면 실패할 때마다 의존성 전체를 처음부터 다시 빌드해서
          # 한 번 돌릴 때마다 50분씩 날아간다.
          cache-on-failure: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (x86-windows-static)
        shell: bash
        run: |
          set -e
          # classic 모드로 필요한 포트만 설치한다.
          # 레포 루트에서 vcpkg 를 돌리면 루트의 vcpkg.json 때문에 manifest 모드가 켜지고
          # ffmpeg/mfx-dispatch 까지 전부 빌드하려 든다 → $VCPKG_ROOT 로 이동해서 실행.
          # RustDesk 는 aom/libvpx/libyuv/opus 를 패치해서 쓰므로 overlay-ports 는 필수다
          # (빼먹으면 upstream 포트가 설치되어 링크 단계에서 엉뚱하게 깨진다).
          OVERLAY="$(pwd)/res/vcpkg"
          echo "overlay-ports: $OVERLAY"
          ls "$OVERLAY"

          cd "$VCPKG_ROOT"
          if ! ./vcpkg install \
                --triplet "${{ env.VCPKG_TRIPLET }}" \
                --overlay-ports="$OVERLAY" \
                libvpx aom libyuv opus libjpeg-turbo; then
            echo "===== vcpkg 실패 — 빌드 로그 tail ====="
            find "${VCPKG_ROOT}/buildtrees" -name "*-out.log" 2>/dev/null | while read -r f; do
              echo "----- $f -----"
              tail -n 60 "$f"
            done
            exit 1
          fi
          echo "===== 설치된 static lib ====="
          ls -la "${VCPKG_ROOT}/installed/${{ env.VCPKG_TRIPLET }}/lib" || true

      # libsodium-sys 0.2.7 의 크로스컴파일 버그 우회.
      #
      # 증상: LNK4272 (library machine type 'x64' conflicts with target machine type 'x86')
      #       + _sodium_* / _crypto_* / _randombytes_* 132개 unresolved external
      #
      # 원인: build.rs 의 get_lib_dir() 가 target_pointer_width 로 분기하는데,
      #       빌드 스크립트 안의 cfg 는 TARGET 이 아니라 HOST 를 가리킨다. 러너가 x64 라
      #       i686 타겟인데도 msvc/x64/Release/v142/libsodium.lib 를 집어온다.
      #
      # 해결: 크레이트가 32비트 lib 도 같이 배포한다 (msvc/Win32/Release/v142/libsodium.lib).
      #       SODIUM_LIB_DIR 을 세우면 build.rs main() 이 find_libsodium_env() 로 빠져서
      #       버그가 있는 get_lib_dir() 를 아예 타지 않는다. 바인딩은 src/sodium_bindings.rs
      #       로 사전 생성돼 있어 헤더도 필요 없다.
      #
      # 주의: SODIUM_STATIC 은 절대 세우지 말 것 (build.rs 가 panic 한다).
      #       SODIUM_SHARED 도 세우지 않는다 - 미설정이 곧 static 링크다.
      #       SODIUM_USE_PKG_CONFIG 과 병용해도 panic 한다.
      - name: Prepare 32-bit libsodium
        shell: bash
        run: |
          set -e
          # Cargo.lock 의 libsodium-sys 버전과 반드시 일치시킬 것.
          # 어긋나면 사전 생성 바인딩과 lib 의 ABI 가 안 맞는다.
          VER=0.2.7
          LOCKED=$(grep -A1 'name = "libsodium-sys"' Cargo.lock | grep '^version' | cut -d'"' -f2)
          echo "Cargo.lock=$LOCKED  workflow=$VER"
          if [ "$LOCKED" != "$VER" ]; then
            echo "FATAL: 버전 불일치. Cargo.lock 을 확인하고 이 워크플로우의 VER 을 맞출 것"
            exit 1
          fi

          # 레포 밖 임시 디렉터리에서 작업한다. 루트에 Cargo.toml 이 든 디렉터리를 풀면
          # cargo 워크스페이스와 엮일 여지가 있어서 아예 피한다.
          WORK=$(mktemp -d)
          cd "$WORK"

          curl -sSL --fail -o libsodium-sys.crate "https://static.crates.io/crates/libsodium-sys/libsodium-sys-${VER}.crate"
          tar xzf libsodium-sys.crate

          SRC="libsodium-sys-${VER}/msvc/Win32/Release/v142/libsodium.lib"
          if [ ! -f "$SRC" ]; then
            echo "FATAL: 32비트 libsodium.lib 를 못 찾음. 크레이트 구조가 바뀐 듯:"
            find "libsodium-sys-${VER}/msvc" -name '*.lib'
            exit 1
          fi

          mkdir -p sodium-x86
          cp "$SRC" sodium-x86/
          ls -la sodium-x86/

          # x86 검증: cdecl 언더스코어 심볼이 있어야 한다. x64 lib 에는 없다.
          if ! grep -aq '_sodium_init' sodium-x86/libsodium.lib; then
            echo "FATAL: 이 lib 에 _sodium_init (x86 cdecl) 심볼이 없다 - 32비트가 아님"
            exit 1
          fi
          echo "x86 확인됨 (_sodium_init 심볼 존재)"

          # MSVC 링커는 MSYS 경로(/tmp/...)를 못 읽는다. cygpath -m 으로 드라이브 경로 변환.
          SODIUM_DIR=$(cygpath -m "$WORK/sodium-x86")
          echo "SODIUM_LIB_DIR=$SODIUM_DIR"
          echo "SODIUM_LIB_DIR=$SODIUM_DIR" >> "$GITHUB_ENV"

      # ── PoC 본체 ──────────────────────────────────────────────────────────
      # cube_headless feature 로 빌드한다 — B안이 실제로 만들 바로 그 형태다.
      # (sciter ui 만 제외, core_main / server / scrap / cuberemote_heartbeat 는 전부 포함)
      #
      # 기성 경로를 재사용하려던 두 시도는 둘 다 방치 코드에 막혔다. 되돌리지 말 것:
      #   --features cli    -> src/cli.rs 가 2024-03 이후 방치. Interface trait 등 19개 에러
      #   --features inline -> sciter-rs dyn_x86 브랜치가 #![feature(abi_thiscall)] 사용.
      #                        1.73 에서 stable 이 된 속성이라 stable 채널에선 되레 E0554
      # RustDesk 가 Flutter 로 넘어가며 나머지 UI 경로를 사실상 버린 결과다.
      #
      # hwcodec/vram 은 ffmpeg 를 요구하므로 제외 (위 vcpkg 단계에서 안 깔았다).
      #
      # check 가 아니라 build 인 이유: x86 은 심볼 앞에 _ 가 붙는 등 링커 단계에서
      # 터지는 게 진짜 위험이라, 실행파일이 나와야 답이 나온다.
      - name: Build rustdesk core (i686, headless)
        shell: bash
        run: |
          set -e
          cargo build --release --target "${{ env.CARGO_TARGET }}" --features cube_headless --bins
          echo "===== 산출물 ====="
          ls -la "target/${{ env.CARGO_TARGET }}/release/"*.exe

      - name: Upload i686 binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: poc-win32-i686-binaries
          path: target/${{ env.CARGO_TARGET }}/release/*.exe
          if-no-files-found: warn

      - name: 결과 요약
        if: always()
        shell: bash
        run: |
          {
            echo "## Phase 0 PoC — Windows x86 (i686)"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| target | \`${{ env.CARGO_TARGET }}\` |"
            echo "| vcpkg triplet | \`${{ env.VCPKG_TRIPLET }}\` |"
            echo "| features | \`cube_headless\` (sciter UI · flutter · hwcodec 제외) |"
            echo ""
            echo "산출물이 생성됐다면 B안(경량 Rust agent) 진행 가능."
            echo "vcpkg 단계에서 죽었으면 코덱 포트의 x86 문제, cargo 단계에서 죽었으면"
            echo "RustDesk 본체/캡처 코드의 x86 문제 — 로그 위치가 판단 근거."
          } >> "$GITHUB_STEP_SUMMARY"
